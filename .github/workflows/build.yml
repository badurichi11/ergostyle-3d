name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename with version
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "V=$V" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Ergostyle-3D-v$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ergostyle-3D-v${{ env.V }}
          path: Ergostyle-3D-v${{ env.V }}.apk
      - name: Put the APK on the Releases page (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Ergostyle 3D v${{ env.V }}
          files: Ergostyle-3D-v${{ env.V }}.apk

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Version from the Android app
        shell: bash
        run: |
          V=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          echo "V=$V" >> "$GITHUB_ENV"
          cd desktop && npm pkg set version="$V.0"
      - name: Copy the viewer into the desktop app
        shell: bash
        run: |
          mkdir -p desktop/app
          cp -r app/src/main/assets/* desktop/app/
          cp desktop/icons/icon.png desktop/app/icon.png
      - name: Build Windows app
        working-directory: desktop
        shell: bash
        run: |
          report() { msg=$(tail -45 "$1" | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=$2::$msg"; }
          npm install --no-audit --no-fund > ../npm.log 2>&1 || { report ../npm.log npm; exit 1; }
          npx electron-builder --win --publish never > ../eb.log 2>&1 || { report ../eb.log electron-builder; exit 1; }
          tail -15 ../eb.log
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Ergostyle-3D-Windows-v${{ env.V }}
          path: |
            desktop/dist/*.exe
      - name: Put the Windows files on the Releases page (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Ergostyle 3D v${{ env.V }}
          files: desktop/dist/*.exe

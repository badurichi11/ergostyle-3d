<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>ერგოსტილი 3D ნახაზი</title>
<style>
/* Layout: full-screen 3D workbench; top bar, right tool rail, bottom sheet for the tapped part, left drawer for the parts list and cut list */
:root{
  --bg:#e9edf1; --surface:#ffffff; --ink:#18212b; --muted:#5d6a79; --line:#d3dae2;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fbe5d8; --shadow:0 6px 24px rgba(20,32,48,.14);
  --f-body:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1c232c; --ink:#e7ecf2; --muted:#9aa7b6; --line:#2e3946;
  --accent:#fb8a4c; --accent-ink:#1a0d05; --accent-soft:#3a2416; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1c232c; --ink:#e7ecf2; --muted:#9aa7b6; --line:#2e3946;
  --accent:#fb8a4c; --accent-ink:#1a0d05; --accent-soft:#3a2416; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#view{position:absolute;inset:0;touch-action:none}
#view canvas{display:block}
button{font:inherit;color:inherit}
.bar{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
.bar>*{pointer-events:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-height:42px;display:flex;align-items:center;gap:8px;padding:0 12px}
.file{flex:1;min-width:0}
.file b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.file small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;min-width:42px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn:focus-visible,.row:focus-visible,.gname:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail{position:absolute;right:12px;top:64px;display:flex;flex-direction:column;gap:8px;z-index:4}
.rail .btn{width:46px;height:46px;padding:0}
.pop{position:absolute;right:66px;top:64px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:grid;gap:8px;width:min(280px,calc(100vw - 92px));max-height:calc(100% - 200px);overflow:auto}
.pop h3{margin:4px 0 0;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;text-transform:uppercase}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg .btn{box-shadow:none;min-height:38px;font-size:13px;padding:0 6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px}
.chk input{accent-color:var(--accent);width:18px;height:18px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sheet{position:absolute;left:12px;top:62px;width:min(196px,calc(100% - 92px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:calc(100% - 140px);overflow:auto}
#sheetBody{padding:9px 34px 10px 11px;display:grid;gap:6px}
.sheet.mini #sheetBody>*:not(.ptitle):not(.dims):not(.crumb:first-child){display:none}
.sheet.mini{max-height:none}
#sheetMin{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
#sheetMin:hover{background:var(--bg)}
#sheetMin svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sheet .hint{font-size:12.5px}
.sheet .ptitle h2{font-size:14.5px}
.sheet .dims{font-size:15px;line-height:1.35}
.sheet .dims small{font-size:11px}
.sheet .kv{font-size:12px;gap:1px;grid-template-columns:1fr}
.sheet .kv dt{font-size:11px;margin-top:4px}
.sheet .acts{flex-direction:column}
.sheet .acts .btn{width:100%}
.sheet .seg{grid-template-columns:1fr}
.sheet .mgrid{grid-template-columns:1fr}
.sheet .mgrid span{display:flex;justify-content:space-between;text-align:left}
.sheet .mgrid b{display:inline}
.sheet .crumb{font-size:12px}
.sheet .names{font-size:12px}
.sheet .acts{gap:5px}
.sheet .acts .btn{min-height:30px;font-size:12px;padding:0 9px;border-radius:8px}
.sheet .seg .btn{min-height:32px;font-size:12px}
.sheet .mgrid{font-size:12px;gap:4px}
.sheet .mgrid span{padding:4px 6px}
.sheet .hint{color:var(--muted);font-size:14px}
.ptitle{display:flex;gap:10px;align-items:flex-start}
.ptitle h2{margin:0;font-size:17px;line-height:1.3;flex:1;min-width:0;text-wrap:balance}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.25);flex:none;margin-top:2px}
.dims{font-family:var(--f-data);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dims small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{box-shadow:none;min-height:36px;font-size:13px}
.acts .btn.primary{box-shadow:none}
.names{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(400px,94vw);z-index:8;background:var(--surface);border-right:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .22s ease}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.dhead input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--bg);color:var(--ink);font:inherit}
.tabs{display:flex;gap:6px;padding:8px 12px 0}
.tabs .btn{box-shadow:none;min-height:34px;font-size:13px;flex:1;padding:0 6px}
.dbody{overflow:auto;flex:1;padding:6px 0 16px}
.grp{padding:8px 12px 4px;display:flex;align-items:center;gap:6px}
.gname{flex:1;min-width:0;border:0;background:none;cursor:pointer;text-align:left;padding:2px 0;font-size:12px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname:hover{color:var(--accent)}
.eye{border:0;background:none;cursor:pointer;padding:4px;color:var(--muted);display:inline-flex}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.eye.off{opacity:.45}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border:0;background:none;width:100%;text-align:left;min-width:0}
.row:hover{background:var(--bg)}
.row.sel{background:var(--accent-soft)}
.row.dim{opacity:.5}
.row .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dm{font-family:var(--f-data);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.row.sel .tick{background:var(--accent);border-color:var(--accent)}
.row.sel .tick::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 12px}
.mrow input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;padding:0;background:none;flex:none}
.mrow .nm{flex:1;min-width:0;font-size:13.5px}
.mrow .ct{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.blk{border-bottom:1px solid var(--line)}
.bline{display:flex;align-items:center}
.bline .bhead{flex:1}
.chk2{flex:none;width:44px;height:44px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.chk2 span{width:20px;height:20px;border:1.8px solid var(--muted);border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.chk2[aria-checked="true"] span{background:var(--accent);border-color:var(--accent)}
.chk2[aria-checked="true"] span::after{content:"";width:9px;height:5px;border-left:2.2px solid var(--accent-ink);border-bottom:2.2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.blk.done .bn{color:var(--muted)}
.ipanel{position:absolute;left:12px;bottom:62px;z-index:5;width:min(240px,calc(100% - 92px));max-height:34%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.iphead{display:flex;align-items:center;gap:6px;padding:5px 4px 5px 10px;border-bottom:1px solid var(--line)}
.iphead b{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iphead span{font-family:var(--f-data);font-size:11.5px;color:var(--muted);white-space:nowrap}
.iphead button{width:28px;height:28px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.iphead button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.ipanel.mini #ipBody{display:none}
.ipanel.mini .iphead{border-bottom:0}
#ipBody{overflow:auto;padding:2px 0 6px}
.iprow{display:flex;align-items:flex-start;gap:0;padding:0 8px 0 0;border-bottom:1px solid var(--line)}
.iprow:last-child{border-bottom:0}
.iprow .chk2{width:32px;height:32px}
.iprow .chk2 span{width:16px;height:16px;border-radius:4px}
.iprow .chk2[aria-checked="true"] span::after{width:7px;height:4px}
.iprow .ipt{flex:1;min-width:0;padding:4px 0;display:grid;gap:0}
.iprow .ipn{font-size:11.5px;font-weight:500;display:flex;gap:6px;justify-content:space-between}
.iprow .ipn i{font-style:normal;font-family:var(--f-data);font-size:11px;color:var(--ink);white-space:nowrap}
.iprow .ipd{font-family:var(--f-data);font-size:10.5px}
.iprow .ipm{font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.iprow.done .ipn,.iprow.done .ipd{color:var(--muted);text-decoration:line-through}
.bhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;cursor:pointer;text-align:left;padding:10px 12px;min-width:0}
.bhead:hover{background:var(--bg)}
.bhead .bn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead .bc{font-family:var(--f-data);font-size:12px;color:var(--muted);white-space:nowrap}
.bhead .chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:none;transition:transform .15s}
.blk.open .chev{transform:rotate(90deg)}
.bexp .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
.bline .bhead{padding-right:4px}
.blk.open .bhead{background:var(--accent-soft)}
.bbox{margin:0 12px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;display:grid;gap:2px}
.bsize{font-family:var(--f-data);font-size:12px;color:var(--muted);padding-bottom:4px}
.bpart{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.bpart:first-of-type{border-top:0}
.bpart .pn{font-weight:500;min-width:0;overflow-wrap:anywhere}
.bpart .pq{font-family:var(--f-data);font-size:12.5px;text-align:right;white-space:nowrap}
.bpart .pd{grid-column:1/-1;font-family:var(--f-data);font-size:12px;color:var(--ink)}
.bpart .pm{grid-column:1/-1;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.btab{overflow-x:auto;margin:2px -4px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.btab table{border-collapse:collapse;width:100%;font-size:12px}
.btab td .pn{display:block;font-weight:500}
.btab td .pm{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.btab th:nth-child(n+2){width:1%}
.btab th{font-weight:500;color:var(--accent);font-size:10.5px;padding:4px 4px;border:1px solid var(--line);text-align:left;white-space:nowrap;background:var(--accent-soft)}
.btab th.c{text-align:center}
.btab td{padding:5px 4px;border:1px solid var(--line);vertical-align:top}
.btab td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-size:11.5px}
.btab td.m{color:var(--muted);font-size:11px;max-width:70px;overflow-wrap:anywhere}
.bsub{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:8px 0 2px}
.bbox .btn{box-shadow:none;min-height:34px;font-size:13px;margin-top:6px}
@media (prefers-reduced-motion:reduce){.bhead .chev{transition:none}}
.cut{padding:4px 12px 12px;overflow-x:auto}
.cut h4{margin:14px 0 6px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.cut h4 small{font-weight:400;color:var(--muted);font-family:var(--f-data);font-size:12px}
.cut table{border-collapse:collapse;width:100%;font-size:13px}
.cut th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:.04em;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.cut td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.cut td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.cut tr[data-k]{cursor:pointer}
.cut tr[data-k]:hover td{background:var(--bg)}
.scrim{position:absolute;inset:0;background:rgba(10,16,24,.35);z-index:7}
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--surface);padding:8px 8px 8px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px}
.toast button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.hchip{position:absolute;bottom:12px;left:12px;z-index:4;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:42px;padding:0 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;gap:8px;max-width:calc(100% - 92px)}
.sbar{position:absolute;top:62px;left:12px;right:70px;z-index:6;display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid #1d6fd8;border-radius:10px;box-shadow:var(--shadow);height:42px;padding:0 4px 0 10px}
.sbar>svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.sbar input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;height:100%;outline:none}
.sbar button{width:34px;height:34px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.sbar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sbar input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#app.searching .sheet{top:112px;max-height:calc(100% - 190px)}
.schip{position:absolute;right:12px;bottom:12px;z-index:4;background:#1d6fd8;color:#fff;border:0;border-radius:10px;min-height:42px;padding:0 12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:calc(50% - 18px)}
.schip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app.has-search .hchip{max-width:calc(50% - 18px)}
.hchip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.mode{position:absolute;bottom:62px;left:12px;z-index:4;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;pointer-events:none;max-width:calc(100% - 92px)}
.mlabel{position:absolute;z-index:3;transform:translate(-50%,-50%);background:var(--accent);color:var(--accent-ink);font-family:var(--f-data);font-size:14px;font-weight:500;padding:3px 7px;border-radius:7px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.mgrid span{background:var(--bg);border-radius:7px;padding:6px 8px;text-align:center;min-width:0}
.mgrid b{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:11.5px}
.pdlg{position:absolute;inset:0;z-index:25;background:rgba(10,16,24,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pdbox{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.pdhead{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 16px}.pdhead b{flex:1;font-size:16px}
.pdhead button{border:0;background:none;width:38px;height:38px;cursor:pointer}.pdhead svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.pdnote{margin:0 16px 8px;font-size:12.5px;color:var(--muted);line-height:1.45}
.pdall{display:flex;gap:14px;padding:0 16px 8px}.pdall button{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:4px 0}
.xrow .cb{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.xrow.on .cb{background:#b42318;border-color:#b42318}.xrow.on .cb::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.xrow.on{background:rgba(180,35,24,.07)}
.mbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}.mbar span{flex:1;font-size:12.5px;color:var(--muted)}
.pdlist{overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.xrow{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.xrow:last-child{border-bottom:0}
.xrow .sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15)}
.xrow .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.xrow .ct{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.xrow.off .nm{text-decoration:line-through;color:var(--muted)}.xrow.off .sw{opacity:.3}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:38px;height:34px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}

<script>
// Bazis .b3d reader (BZ85 container, zlib streams, tagged binary tree)
// Works in browser (pako global) and node (require('zlib')).
var B3D = (function () {
  var inflateFn = null;
  function setInflate(fn) { inflateFn = fn; }

  var cp1251 = null;
  try { cp1251 = new TextDecoder('windows-1251'); } catch (e) {}
  var u16 = new TextDecoder('utf-16le');

  function fixName(s) {
    if (!s || !cp1251) return s;
    var hi = false;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c > 255) return s;
      if (c >= 0xC0) hi = true;
    }
    if (!hi) return s;
    var b = new Uint8Array(s.length);
    for (var j = 0; j < s.length; j++) b[j] = s.charCodeAt(j);
    return cp1251.decode(b);
  }

  // find zlib streams; returns array of Uint8Array (decompressed)
  function streams(buf) {
    var out = [];
    for (var i = 0; i < buf.length - 2; i++) {
      if (buf[i] !== 0x78) continue;
      var f = buf[i + 1];
      if (f !== 0x01 && f !== 0x5e && f !== 0x9c && f !== 0xda) continue;
      var r = inflateFn(buf.subarray(i));
      if (r && r.data && r.data.length > 100) {
        out.push(r.data);
        i += Math.max(1, r.consumed) - 1;
      }
    }
    return out;
  }

  function parseTree(r) {
    var dv = new DataView(r.buffer, r.byteOffset, r.byteLength);
    var p = 0;
    function u32() { var v = dv.getUint32(p, true); p += 4; return v; }
    var nn = u32(), names = [];
    for (var i = 0; i < nn; i++) {
      var L = u32(), s = '';
      for (var j = 0; j < L; j++) s += String.fromCharCode(r[p + j]);
      names.push(s); p += L;
    }
    function val(t, n) {
      switch (t) {
        case 0: return obj(n);
        case 1: return !!n;
        case 2: case 8: return null;
        case 3: return r[p++];
        case 4: p += 4; return dv.getInt32(p - 4, true);
        case 5: p += 8; return dv.getFloat64(p - 8, true);
        case 6: var L = u32(); var s = u16.decode(r.subarray(p, p + 2 * L)); p += 2 * L; return s;
        case 7: var L2 = u32(); var b = r.subarray(p, p + L2); p += L2; return b;
      }
      throw new Error('stop');
    }
    function obj(n) {
      var items = [];
      for (var i = 0; i < n; i++) {
        var k = u32(), c = u32(), t = r[p++];
        var nm = k < names.length ? names[k] : String(k);
        var v;
        try { v = val(t, c); }
        catch (e) { if (e.partial) items.push([nm, e.partial]); var e2 = new Error('stop'); e2.partial = items; throw e2; }
        items.push([nm, v]);
      }
      return items;
    }
    var top = [];
    try { while (p < r.length) top = top.concat(obj(1)); }
    catch (e) { if (e.partial) top = top.concat(e.partial); }
    return top;
  }

  function get(items, key) {
    for (var i = 0; i < items.length; i++) if (items[i][0] === key) return items[i][1];
    return undefined;
  }

  function contour(b) {
    if (!b || b.length < 4) return [];
    var dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    var n = dv.getUint32(0, true), p = 4, segs = [];
    function d() { p += 8; return dv.getFloat64(p - 8, true); }
    for (var i = 0; i < n && p < b.length; i++) {
      var t = b[p++];
      if (t === 0x10) segs.push({ t: 'L', x1: d(), y1: d(), x2: d(), y2: d() });
      else if (t === 0x12) { var s = { t: 'A', cx: d(), cy: d(), x1: d(), y1: d(), x2: d(), y2: d() }; s.cw = b[p++] === 0; segs.push(s); }
      else if (t === 0x11 || t === 0x14) segs.push({ t: 'C', cx: d(), cy: d(), r: d() });
      else break;
    }
    return segs;
  }

  function trans(items) {
    var t = items ? items : [];
    return {
      x: get(t, 'X') || 0, y: get(t, 'Y') || 0, z: get(t, 'Z') || 0,
      qx: get(t, 'Rx') || 0, qy: get(t, 'Ry') || 0, qz: get(t, 'Rz') || 0,
      qw: get(t, 'Rw') === undefined ? 1 : get(t, 'Rw')
    };
  }

  // flatten model into parts list with hierarchy
  function load(buf) {
    if (buf[0] !== 0x42 || buf[1] !== 0x5a) throw new Error('ეს ბაზისის ფაილი არ არის');
    var ss = streams(buf), top = null;
    for (var i = ss.length - 1; i >= 0; i--) {
      var tr = parseTree(ss[i]);
      if (tr.length && tr[0][0] === 'Document') { top = tr[0][1]; break; }
    }
    if (!top) throw new Error('ფაილში მოდელი ვერ მოიძებნა');
    var model = get(top, 'Model') || [];
    var nodes = [];
    function walk(objs, parent) {
      for (var i = 0; i < objs.length; i++) {
        if (objs[i][0] !== 'Obj' || !Array.isArray(objs[i][1])) continue;
        var o = objs[i][1];
        var node = {
          idx: nodes.length, parent: parent,
          type: get(o, 'Type'), id: get(o, 'ID'),
          name: (fixName(get(o, 'Name')) || '').split('\r')[0].trim(),
          mat: (fixName(get(o, 'Mat')) || '').split('\r')[0].trim(),
          color: get(o, 'Color'),
          trans: trans(get(o, 'Trans')),
          thick: get(o, 'Thick'), length: get(o, 'Thickness'), matThick: get(o, 'MatThick'),
          segs: contour(get(o, 'Contour')),
          butts: [], children: []
        };
        node.cuts = [];
        var ct = get(o, 'Cuts');
        if (Array.isArray(ct)) for (var c2 = 0; c2 < ct.length; c2++) {
          if (Array.isArray(ct[c2][1])) node.cuts.push({ name: fixName(get(ct[c2][1], 'Name')) || '', sign: fixName(get(ct[c2][1], 'Sign')) || '', prof: contour(get(ct[c2][1], 'Contour')), traj: contour(get(ct[c2][1], 'Trajectory')) });
        }
        var bt = get(o, 'Butts');
        if (Array.isArray(bt)) for (var j = 0; j < bt.length; j++) {
          if (Array.isArray(bt[j][1])) node.butts.push({ mat: fixName(get(bt[j][1], 'Mat')) || '', elem: get(bt[j][1], 'Elem'), sign: get(bt[j][1], 'Sign') || '' });
        }
        nodes.push(node);
        if (parent) parent.children.push(node);
        var kids = get(o, 'Objs');
        if (Array.isArray(kids)) walk(kids, node);
      }
    }
    walk(model, null);
    return nodes;
  }

  return { setInflate: setInflate, load: load, fixName: fixName };
})();
if (typeof module !== 'undefined') module.exports = B3D;

</script>

    busy('PDF იკრიბება…'); await nextFrame();
    var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: pages[0].land ? 'l' : 'p', compress: true });
    pages.forEach(function (pg, i) { if (i) doc.addPage('a4', pg.land ? 'l' : 'p'); doc.addImage(pg.c.toDataURL('image/jpeg', 0.86), 'JPEG', 0, 0, pg.land ? 297 : 210, pg.land ? 210 : 297); });
    var blob = doc.output('blob');
    S.hidden = savedHidden; S.explode = savedExplode; applyExplode(); applyLook();
    busy(null);

  } catch (e) {
    console.error(e); S.hidden = savedHidden; S.explode = savedExplode; applyExplode(); applyLook(); busy(null);

}
function blobToB64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); }); }
async function saveFile(blob, name) {
  if (window.Android && window.Android.savePdf) { window.Android.savePdf(await blobToB64(blob), name); return; }
  var dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast('PDF შენახულია.'); }
    catch (e) { if (!e || e.code !== 'declined') toast('PDF ვერ შეინახა' + (e && e.code ? ' (' + e.code + ')' : '') + '.'); }
    return;

  catch (e) { toast('აქ PDF-ის შენახვა ვერ ხერხდება. სცადე აპლიკაციიდან.'); }
}
$('bPdf').onclick = openPdfDialog;

/* ---------- loading ---------- */
function openBytes(bytes, name) {
  try {
    var nodes = B3D.load(bytes);
    var hsh = 2166136261; for (var hi = 0; hi < bytes.length; hi += 37) { hsh ^= bytes[hi]; hsh = Math.imul(hsh, 16777619) >>> 0; }
    S.fileKey = name + '|' + bytes.length + '|' + hsh.toString(36); loadMarks(); loadExcl();
    $('fname').textContent = name;
    var cnt = nodes.filter(function (n) { return (n.type === 4002 || n.type === 2004 || n.type === 999) && !isRoom(n); }).length;
    $('fmeta').textContent = cnt + ' დეტალი · ' + nodes.filter(function (n) { return n.type === 1005 || n.type === 4001; }).length + ' ბლოკი';
    S.explode = 0; $('rExplode').value = 0;
    if (M.on) setMeasure(false); clearMeasure();
    if (S.multi) setMulti(false);
    build(nodes);
    if (!window._hinted) { window._hinted = true; toast('შეეხე დეტალს: ნახავ სახელს, ზომას და მასალას.'); }
  } catch (e) {
    console.error(e);
    toast('ფაილი ვერ გაიხსნა: ' + (e.message || e) + '. შეამოწმე, რომ ეს ბაზისის .b3d ფაილია.');
  }
}
function openFile(f) {
  if (!f) return;
  var r = new FileReader();
  r.onload = function () { openBytes(new Uint8Array(r.result), f.name.replace(/\.b3d$/i, '')); };
  r.onerror = function () { toast('ფაილის წაკითხვა ვერ მოხერხდა.'); };
  r.readAsArrayBuffer(f);
}
$('fileIn').addEventListener('change', function () { openFile(this.files[0]); this.value = ''; });
var dragN = 0;
window.addEventListener('dragenter', function (e) { e.preventDefault(); dragN++; $('drop').hidden = false; });
window.addEventListener('dragleave', function () { if (--dragN <= 0) { dragN = 0; $('drop').hidden = true; } });
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) { e.preventDefault(); dragN = 0; $('drop').hidden = true; openFile(e.dataTransfer.files[0]); });

function b64bytes(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
window.openB64 = function (b64, name) { openDrawer(false); closePops(); openBytes(b64bytes(b64), name || 'ნახაზი'); };
window.goBack = function () {
  if ($('drawer').classList.contains('open')) { openDrawer(false); return true; }
  if (!$('pViews').hidden || !$('pExplode').hidden) { closePops(); return true; }
  if (!$('sbar').hidden) { openSearchBar(false); return true; }
  if (M.on) { setMeasure(false); return true; }
  if (S.chosen.length) { select(null); return true; }
  return false;
};

window.addEventListener('resize', resize);
resize();
loop();
openBytes(b64bytes(SAMPLE_B64), SAMPLE_NAME);

plugins { id 'com.android.application' }

android {
    namespace 'ge.ergostyle.viewer3d'
    compileSdk 34
    defaultConfig {
        applicationId 'ge.ergostyle.viewer3d'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

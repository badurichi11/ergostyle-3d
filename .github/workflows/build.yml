name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Ergostyle-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ergostyle-3D-apk
          path: Ergostyle-3D.apk
